        ];


        // --- DOM Elements ---
        const quizTitleEl = document.getElementById('quiz-title');
        const questionTextEl = document.getElementById('question-text');
        const optionsContainerEl = document.getElementById('options-container');
        const feedbackEl = document.getElementById('feedback');
        const checkBtn = document.getElementById('check-btn');
        const nextBtn = document.getElementById('next-btn');
        const prevBtn = document.getElementById('prev-btn'); // Added reference for Back button
        const questionCounterEl = document.getElementById('question-counter');
        const quizContainer = document.getElementById('quiz');
        const quizCompleteContainer = document.getElementById('quiz-complete');
        const finalScoreEl = document.getElementById('final-score');
        const totalPossibleScoreEl = document.getElementById('total-possible-score');
        const restartBtn = document.getElementById('restart-btn');

        // --- State ---
        let currentQuestionIndex = 0;
        let selectedAnswerIndex = null;
        let score = 0;
        let quizFinished = false; // Tracks if the current question has been checked
        let shuffledQuizData = []; // Array to hold the shuffled questions for the current session
        let canNavigateBack = false; // Flag to control the back button limitation
        let userAnswersState = {}; // Object to store the state of answered questions { questionIndex: {selectedIndex: number, wasCorrect: boolean} }

        // --- Functions ---

        /**
         * Shuffles array in place using Fisher-Yates algorithm.
         * @param {Array} array Array containing items.
         */
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]]; // Swap elements
            }
        }


        // Function to display the current question and options
        function displayQuestion() {
            quizFinished = false; // Reset finished state for the new question
            selectedAnswerIndex = null; // Reset selected answer for the new question

            const currentQuestion = shuffledQuizData[currentQuestionIndex];
            questionTextEl.textContent = currentQuestion.question;
            questionCounterEl.textContent = `Frage ${currentQuestionIndex + 1} von ${shuffledQuizData.length}`;

            optionsContainerEl.innerHTML = '';
            feedbackEl.textContent = '';
            feedbackEl.className = 'feedback';

            const previousAnswerState = userAnswersState[currentQuestionIndex]; // Check if this question was answered before

            currentQuestion.options.forEach((option, index) => {
                const button = document.createElement('button');
                button.textContent = option;
                button.className = 'option-btn';
                button.dataset.index = index;

                if (previousAnswerState) {
                    // If navigating back to an answered question, show its state
                    button.disabled = true; // Disable options
                    if (index === previousAnswerState.selectedIndex) {
                        button.classList.add(previousAnswerState.wasCorrect ? 'correct' : 'incorrect');
                    }
                    // Highlight the correct answer if the user was wrong
                    if (!previousAnswerState.wasCorrect && index === currentQuestion.correctAnswerIndex) {
                         button.classList.add('correct');
                    }
                } else {
                    // If it's a new or revisited-but-not-yet-answered question
                    button.addEventListener('click', handleOptionSelect);
                }
                optionsContainerEl.appendChild(button);
            });

            // Set button visibility and feedback based on whether the question was previously answered
            if (previousAnswerState) {
                checkBtn.classList.add('hidden');
                nextBtn.classList.remove('hidden');
                feedbackEl.textContent = previousAnswerState.wasCorrect ? 'Richtig!' : 'Falsch!';
                feedbackEl.classList.add(previousAnswerState.wasCorrect ? 'correct' : 'incorrect');
                quizFinished = true; // Mark as finished to prevent re-answering
            } else {
                checkBtn.disabled = true; // Disabled until an option is selected
                checkBtn.classList.remove('hidden');
                nextBtn.classList.add('hidden');
            }

            // Enable/disable Back button based on index and canNavigateBack flag
            prevBtn.disabled = currentQuestionIndex === 0 || !canNavigateBack;

            // Ensure the main quiz container is visible
             quizContainer.style.display = 'block';
             quizCompleteContainer.classList.add('hidden');

             // Scroll window to top to see the question
             window.scrollTo(0, 0);
        }

        // Function to handle option selection (before checking)
        function handleOptionSelect(event) {
            if (quizFinished) return;

            const selectedButton = event.target;
            selectedAnswerIndex = parseInt(selectedButton.dataset.index);

            const optionButtons = optionsContainerEl.querySelectorAll('.option-btn');
            optionButtons.forEach(btn => {
                btn.classList.remove('selected', 'correct', 'incorrect');
            });

            selectedButton.classList.add('selected');
            checkBtn.disabled = false;
        }

        // Function to check the selected answer
        function checkAnswer() {
            if (selectedAnswerIndex === null) return;

            quizFinished = true;
            const correctIndex = shuffledQuizData[currentQuestionIndex].correctAnswerIndex;
            const wasCorrect = selectedAnswerIndex === correctIndex;

            // Store the answer state
            userAnswersState[currentQuestionIndex] = {
                 selectedIndex: selectedAnswerIndex,
                 wasCorrect: wasCorrect
            };


            const optionButtons = optionsContainerEl.querySelectorAll('.option-btn');
            optionButtons.forEach((btn, index) => {
                btn.disabled = true;
                btn.classList.remove('selected');

                if (index === correctIndex) {
                    btn.classList.add('correct');
                } else if (index === selectedAnswerIndex) {
                    btn.classList.add('incorrect');
                }
            });

            if (wasCorrect) {
                score++; // Only increment score when initially answered correctly
                feedbackEl.textContent = 'Richtig!';
                feedbackEl.classList.add('correct');
            } else {
                feedbackEl.textContent = 'Falsch!';
                feedbackEl.classList.add('incorrect');
            }

            checkBtn.classList.add('hidden');
            checkBtn.disabled = true;
            nextBtn.classList.remove('hidden');
            canNavigateBack = true; // Allow going back once after checking
            prevBtn.disabled = currentQuestionIndex === 0; // Re-enable if not first question


            if (currentQuestionIndex === shuffledQuizData.length - 1) {
                nextBtn.textContent = 'Ergebnis anzeigen';
            } else {
                nextBtn.textContent = 'Nächste Frage';
            }
             // Scroll to the feedback/button area after checking
             try {
                feedbackEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
             } catch (e) {
                console.error("Could not scroll to feedback:", e);
             }
        }


        // Function to go to the next question or show results
        function nextQuestion() {
            if (currentQuestionIndex < shuffledQuizData.length - 1) {
                currentQuestionIndex++;
                canNavigateBack = true; // Allow going back after moving forward
                displayQuestion();
            } else {
                 quizContainer.style.display = 'none';
                 quizCompleteContainer.classList.remove('hidden');
                 quizCompleteContainer.style.display = 'block';

                 finalScoreEl.textContent = score;
                 totalPossibleScoreEl.textContent = shuffledQuizData.length;
                 window.scrollTo(0,0);
            }
        }

        // Function to go to the previous question
        function prevQuestion() {
             if (currentQuestionIndex > 0 && canNavigateBack) {
                 currentQuestionIndex--;
                 canNavigateBack = false; // Disable going back further immediately
                 // Display the previous question with its stored state
                 displayQuestion();
             }
        }


        // Function to restart the quiz
        function restartQuiz() {
            currentQuestionIndex = 0;
            score = 0;
            selectedAnswerIndex = null;
            quizFinished = false;
            canNavigateBack = false; // Reset back navigation flag
            userAnswersState = {}; // Clear stored answers
            shuffleArray(shuffledQuizData); // Re-shuffle
            displayQuestion();
        }

        // --- Event Listeners ---
         document.addEventListener('DOMContentLoaded', () => {
            const checkBtnElem = document.getElementById('check-btn');
            const nextBtnElem = document.getElementById('next-btn');
            const prevBtnElem = document.getElementById('prev-btn');
            const restartBtnElem = document.getElementById('restart-btn');

            if(checkBtnElem) checkBtnElem.addEventListener('click', checkAnswer);
            if(nextBtnElem) nextBtnElem.addEventListener('click', nextQuestion);
            if(prevBtnElem) prevBtnElem.addEventListener('click', prevQuestion);
            if(restartBtnElem) restartBtnElem.addEventListener('click', restartQuiz);

            // --- Initial Load ---
            const totalQuestions = quizData.length;
            document.title = `Interaktives Multiple-Choice-Quiz (${totalQuestions} Fragen): Gastronomie & Hotellerie Österreich`;
            const quizTitleElem = document.getElementById('quiz-title');
            if (quizTitleElem) quizTitleElem.textContent = `Multiple-Choice-Quiz (${totalQuestions} Fragen): Gastronomie & Hotellerie`;
            const totalPossibleScoreElem = document.getElementById('total-possible-score');
             if (totalPossibleScoreElem) totalPossibleScoreElem.textContent = totalQuestions;

            shuffledQuizData = [...quizData];
            shuffleArray(shuffledQuizData);

            displayQuestion();
         });


    </script>
