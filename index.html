<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interaktives Lernquiz: Gastronomie & Recht (Weitere Fragen)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        /* Basic body styling */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6; /* Tailwind gray-100 */
        }
        /* Container for the quiz */
        .quiz-container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 2rem;
            background-color: white;
            border-radius: 0.5rem; /* Tailwind rounded-lg */
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06); /* Tailwind shadow-md */
        }
        /* Styling for the question text */
        .question-text {
            font-size: 1.125rem; /* Tailwind text-lg */
            font-weight: 500; /* Tailwind font-medium */
            margin-bottom: 1.5rem;
            color: #1f2937; /* Tailwind gray-800 */
        }
        /* Styling for answer option buttons */
        .option-button {
            display: block;
            width: 100%;
            text-align: left;
            padding: 0.75rem 1rem;
            margin-bottom: 0.75rem;
            border: 1px solid #d1d5db; /* Tailwind border-gray-300 */
            border-radius: 0.375rem; /* Tailwind rounded-md */
            background-color: white;
            color: #374151; /* Tailwind gray-700 */
            transition: background-color 0.2s, border-color 0.2s;
            cursor: pointer; /* Add cursor pointer */
        }
        /* Hover effect for enabled option buttons */
        .option-button:hover:not(:disabled) {
            background-color: #f9fafb; /* Tailwind gray-50 */
            border-color: #9ca3af; /* Tailwind gray-400 */
        }
        /* Style for selected but not yet checked/confirmed answer */
        .option-button.selected:not(.correct):not(.incorrect) {
            background-color: #dbeafe; /* Tailwind blue-100 */
            border-color: #60a5fa; /* Tailwind blue-400 */
        }
        /* Style for correctly answered option */
        .option-button.correct {
            background-color: #d1fae5 !important; /* Tailwind green-100, !important to override other states */
            border-color: #34d399 !important; /* Tailwind green-400 */
            color: #065f46 !important; /* Tailwind green-800 */
        }
        /* Style for incorrectly answered option */
        .option-button.incorrect {
            background-color: #fee2e2 !important; /* Tailwind red-100 */
            border-color: #f87171 !important; /* Tailwind red-400 */
            color: #991b1b !important; /* Tailwind red-800 */
        }
        /* Style for disabled option buttons (after answer or when reviewing) */
         .option-button:disabled {
            background-color: #f3f4f6; /* Lighter gray */
            border-color: #e5e7eb;
            color: #9ca3af; /* Lighter text */
            cursor: not-allowed; /* Indicate non-interactive */
        }
        /* Styling for the feedback text (correct/incorrect) */
        .feedback-text {
            margin-top: 1rem;
            font-weight: 500;
            min-height: 1.5em; /* Reserve space to prevent layout shifts */
        }
        .feedback-text.correct {
            color: #059669; /* Tailwind green-600 */
        }
        .feedback-text.incorrect {
            color: #dc2626; /* Tailwind red-600 */
        }
        /* Container for the progress bar */
        .progress-bar-container {
            width: 100%;
            background-color: #e5e7eb; /* Tailwind gray-200 */
            border-radius: 0.25rem; /* Tailwind rounded-sm */
            overflow: hidden;
            margin-bottom: 1.5rem;
        }
        /* The progress bar itself */
        .progress-bar {
            height: 10px;
            background-color: #3b82f6; /* Tailwind blue-500 */
            width: 0%; /* Initial width */
            transition: width 0.3s ease-in-out; /* Smooth transition */
        }
        /* General styling for navigation buttons */
        .navigation-button {
            padding: 0.5rem 1.5rem;
            border-radius: 0.375rem; /* Tailwind rounded-md */
            font-weight: 500;
            transition: background-color 0.2s, opacity 0.2s, visibility 0s; /* Added visibility transition (instant) */
            cursor: pointer;
        }
        /* Style for disabled navigation buttons */
         .navigation-button:disabled {
             background-color: #9ca3af; /* Tailwind gray-400 */
             cursor: not-allowed;
             opacity: 0.7;
         }
        /* Styling for the 'Next'/'Submit' button */
        .navigation-button.action {
            background-color: #3b82f6; /* Tailwind blue-500 */
            color: white;
        }
        .navigation-button.action:hover:not(:disabled) {
            background-color: #2563eb; /* Tailwind blue-600 */
        }
        /* Styling for the 'Previous' button */
         .navigation-button.prev {
            background-color: #6b7280; /* Tailwind gray-500 */
            color: white;
        }
        .navigation-button.prev:hover:not(:disabled) {
            background-color: #4b5563; /* Tailwind gray-600 */
        }
        /* Styling for the 'Restart' button */
         .navigation-button.restart {
            background-color: #10b981; /* Tailwind emerald-500 */
            color: white;
        }
        .navigation-button.restart:hover {
            background-color: #059669; /* Tailwind emerald-600 */
        }
        /* Styling for the score text on the results page */
        .score-text {
             font-size: 1.125rem; /* Tailwind text-lg */
             font-weight: 500;
             margin-bottom: 1rem;
        }
        /* Styling for the final score number */
        .final-score {
            font-size: 1.5rem; /* Tailwind text-2xl */
            font-weight: 700; /* Tailwind font-bold */
            color: #1d4ed8; /* Tailwind blue-700 */
        }
         /* Styling for the grade text */
        .grade-text {
            font-size: 1.25rem; /* Tailwind text-xl */
            font-weight: 600; /* Tailwind font-semibold */
            margin-top: 0.5rem; /* Add some space above the grade */
        }
        /* Utility class to hide elements using display: none */
        .hidden {
             display: none;
        }
         /* Utility class to hide elements visually but keep layout space */
         .invisible {
             visibility: hidden;
             pointer-events: none; /* Prevent interaction with invisible elements */
         }
        /* Container for navigation buttons (Previous, Submit, Next) */
        .button-container {
            display: flex;
            justify-content: space-between; /* Space between prev and action buttons */
            align-items: center;
            margin-top: 1.5rem; /* mt-6 */
        }
        /* Container specifically for the right-aligned action buttons */
        .action-button-group {
            display: flex;
            gap: 0.5rem; /* space-x-2 */
        }

    </style>
</head>
<body class="p-4">

    <div id="quiz-container" class="quiz-container">
        <h1 class="text-2xl font-bold mb-6 text-center text-gray-700">Interaktives Lernquiz</h1>

        <div id="progress-container" class="mb-6">
             <div class="text-sm font-medium text-gray-600 mb-1" id="progress-label">Frage 1 von X</div>
             <div class="progress-bar-container">
                <div id="progress-bar" class="progress-bar"></div>
            </div>
        </div>

        <div id="question-area">
            <p id="question-text" class="question-text"></p>
            <div id="options-container">
                </div>
            <div id="feedback" class="feedback-text mt-4"></div>
        </div>

        <div id="results-area" class="hidden text-center">
            <h2 class="text-xl font-semibold mb-4">Quiz beendet!</h2>
            <p class="score-text">Dein Ergebnis:</p>
            <p class="final-score"><span id="final-score-correct">0</span> von <span id="final-score-total">0</span> richtig</p>
            <p class="score-text mt-2"><span id="final-percentage">0</span>%</p>
            <p class="grade-text" id="final-grade"></p>
             <button id="restart-button" class="navigation-button restart mt-6">Quiz neu starten</button>
        </div>

        <div id="navigation-buttons" class="button-container">
             <button id="prev-button" class="navigation-button prev invisible">Zurück</button>
             <div class="action-button-group">
                 <button id="submit-button" class="navigation-button action" disabled>Antwort prüfen</button> <button id="next-question-button" class="navigation-button action hidden">Nächste Frage</button> </div>
        </div>
    </div>

    <script>
        // --- Quiz Data ---
        // Array containing all quiz questions, options, and correct answers.
        const quizData = [
            // Lebensmittelkunde Block (Gerfried PDF / Lena PDF)
            { question: "Welche Zutaten werden für einen Strudelteig benötigt?", options: ["Weizenmehl (Typ 480), Butter, Salz, kaltes Wasser", "Weizenmehl (Typ 700), Öl, Salz, lauwarmes Wasser", "Roggenmehl, Öl, Zucker, lauwarmes Wasser", "Dinkelmehl, Butter, Salz, Milch"], correctAnswer: "Weizenmehl (Typ 700), Öl, Salz, lauwarmes Wasser", source: "Gerfried PDF, F1 / Lena PDF S.1" },
            { question: "Wie lange sollte Strudelteig rasten?", options: ["10 min", "30 min", "60 min", "Über Nacht"], correctAnswer: "30 min", source: "Gerfried PDF, F1 / Lena PDF S.1" },
            { question: "Was ist ein wichtiger Schritt bei der Zubereitung von Kaiserschmarren?", options: ["Eier nicht trennen", "Eischnee unter die Masse heben", "Nur Dotter verwenden", "Keine Milch hinzufügen"], correctAnswer: "Eischnee unter die Masse heben", source: "Gerfried PDF, F2 / Lena PDF S.1" },
            { question: "Welche der folgenden ist eine traditionelle österreichische Mehlspeise?", options: ["Cheesecake", "Tiramisu", "Linzer Torte", "Brownie"], correctAnswer: "Linzer Torte", source: "Gerfried PDF, F3 / Lena PDF S.1" },
            { question: "Welches der folgenden ist ein traditionelles österreichisches Dessert?", options: ["Crème brûlée", "Panna Cotta", "Marillenknödel", "Mousse au Chocolat"], correctAnswer: "Marillenknödel", source: "Gerfried PDF, F3 / Lena PDF S.1" },
            { question: "Was muss beim Einfrieren von Fleisch beschriftet werden?", options: ["Nur der Inhalt", "Nur das Datum des Einfrierens", "Datum des Einfrierens, Inhalt, evtl. MHD und Allergene", "Nur die Allergene"], correctAnswer: "Datum des Einfrierens, Inhalt, evtl. MHD und Allergene", source: "Gerfried PDF, F4 / Lena PDF S.1" },
            { question: "Bei welcher Mindesttemperatur muss Fleisch tiefgekühlt gelagert werden?", options: ["-12°C", "-15°C", "-18°C", "-25°C"], correctAnswer: "-18°C", source: "Gerfried PDF, F5 / Lena PDF, S.1" },
            { question: "Wie sollte Fleisch idealerweise aufgetaut werden?", options: ["Bei Raumtemperatur", "In der Mikrowelle", "Im Kühlhaus", "Unter heißem Wasser"], correctAnswer: "Im Kühlhaus", source: "Gerfried PDF, F4 / Lena PDF S.1" },
            { question: "Welcher Temperaturbereich gilt generell für ein Kühlhaus?", options: ["0-4°C", "2-8°C", "5-10°C", "-2-2°C"], correctAnswer: "2-8°C", source: "Gerfried PDF, F5 / Lena PDF S.1" },
            { question: "Bei welcher Temperatur sollte Faschiertes gelagert werden?", options: ["0°C", "3°C", "5°C", "8°C"], correctAnswer: "3°C", source: "Gerfried PDF, F5 / Lena PDF S.1" },
            { question: "Wie wird Fisch idealerweise im Kühlhaus gelagert?", options: ["Offen auf einem Regal", "In einer geschlossenen Box", "Auf Eis um den Gefrierpunkt", "Eingefroren bei -5°C"], correctAnswer: "Auf Eis um den Gefrierpunkt", source: "Gerfried PDF, F5 / Lena PDF S.1" },
            { question: "Welche Temperatur sollte ein Trockenlager haben?", options: ["Unter 10°C", "Unter 18°C", "Genau 20°C", "Über 25°C"], correctAnswer: "Unter 18°C", source: "Gerfried PDF, F5 / Lena PDF S.1 (unterschiedliche Angaben, Gerfried <18, Lena 15-23)" },
            { question: "Was ist beim Schockfrosten typisch?", options: ["Temperatur von -10°C", "Langsames Einfrieren", "Temperatur von -30°C", "Nur für Gemüse geeignet"], correctAnswer: "Temperatur von -30°C", source: "Gerfried PDF, F5 / Lena PDF S.1" },
            { question: "Was darf bezüglich der Kühlkette niemals passieren?", options: ["Sie darf kurzzeitig überschritten werden", "Sie darf nie unterbrochen werden", "Sie gilt nur für Fleisch", "Sie ist nur eine Empfehlung"], correctAnswer: "Sie darf nie unterbrochen werden", source: "Gerfried PDF, F5 / Lena PDF S.1/S.4" },
            { question: "Welche Fischart gehört zu den Rundfischen?", options: ["Scholle", "Seezunge", "Zander", "Heilbutt"], correctAnswer: "Zander", source: "Gerfried PDF, F6 / Lena PDF S.1" },
            { question: "Welche Fischart gehört zu den Plattfischen?", options: ["Forelle", "Karpfen", "Wels", "Scholle"], correctAnswer: "Scholle", source: "Gerfried PDF, F6 / Lena PDF S.2" },
            { question: "Wie viele Filets hat ein Plattfisch typischerweise?", options: ["Ein Filet", "Zwei Filets", "Drei Filets", "Vier Filets"], correctAnswer: "Vier Filets", source: "Gerfried PDF, F6 / Lena PDF S.1" },
            { question: "Welcher Fisch ist ein Wanderfisch?", options: ["Hecht", "Zander", "Lachs", "Kabeljau"], correctAnswer: "Lachs", source: "Gerfried PDF, F6 / Lena PDF S.1" },
            { question: "Wie lange darf warmes Essen am Buffet maximal stehen, bevor es wieder auf 75°C Kerntemperatur erhitzt werden muss?", options: ["1 Stunde", "2 Stunden", "3 Stunden", "4 Stunden"], correctAnswer: "3 Stunden", source: "Gerfried PDF, F7 / Lena PDF, S.2" },
            { question: "Welche Konservierungsmethode entzieht Wasser durch Holzrauch?", options: ["Trocknen", "Pasteurisieren", "Räuchern", "Vakuumverpacken"], correctAnswer: "Räuchern", source: "Gerfried PDF, F8 / Lena PDF S.5" },
            { question: "Welches Teil vom Schwein wird typischerweise für Schnitzel verwendet?", options: ["Bauch", "Schopf", "Nuss (aus dem Schlögel)", "Stelze"], correctAnswer: "Nuss (aus dem Schlögel)", source: "Gerfried PDF, F9 / Lena PDF S.5" },
            { question: "Wofür wird das lange Karree vom Schwein oft verwendet?", options: ["Gulasch", "Speck", "Koteletts", "Klachelsuppe"], correctAnswer: "Koteletts", source: "Gerfried PDF, F9 / Lena PDF S.5" },
            { question: "Welcher Teil vom Rind wird als 'Der Englische' bezeichnet?", options: ["Die Schulter", "Der Hals", "Der Rücken", "Der Schlögel"], correctAnswer: "Der Rücken", source: "Gerfried PDF, F10 & F13 / Lena PDF, S.7" },
            { question: "Wer ist der Stellvertreter des Küchenchefs in einer Küchenbrigade?", options: ["Saucier", "Gardemanger", "Sous Chef", "Patissier"], correctAnswer: "Sous Chef", source: "Gerfried PDF, F11 / Lena PDF S.7" },
            { question: "Welcher Koch ist für die kalte Küche zuständig?", options: ["Entremetier", "Rotisseur", "Saucier", "Gardemanger"], correctAnswer: "Gardemanger", source: "Gerfried PDF, F11 / Lena PDF S.7" },
            { question: "Was ist ein Kombidämpfer?", options: ["Ein spezieller Grill", "Ein Heißluftofen mit Dampferzeuger", "Eine Fritteuse mit Deckel", "Ein Gerät zum Vakuumgaren"], correctAnswer: "Ein Heißluftofen mit Dampferzeuger", source: "Gerfried PDF, F12 / Lena PDF S.7" },
            { question: "Wofür wird der Wadschinken vom Rind typischerweise verwendet?", options: ["Steaks", "Schnitzel", "Gulasch, Ragout", "Suppeneinlage"], correctAnswer: "Gulasch, Ragout", source: "Gerfried PDF, F13 / Lena PDF S.8" },
            { question: "Welches bekannte Gericht wird aus dem Tafelspitz vom Rind zubereitet?", options: ["Rindsrouladen", "Gekochter Tafelspitz", "Filet Wellington", "Roastbeef"], correctAnswer: "Gekochter Tafelspitz", source: "Gerfried PDF, F13 / Lena PDF S.8" },
            { question: "Wie heißt der Lungenbraten vom Rind auch?", options: ["Roastbeef", "Entrecote", "Rinderfilet", "Hüftsteak"], correctAnswer: "Rinderfilet", source: "Gerfried PDF, F13 / Lena PDF S.7/S.8" },
            { question: "Welcher Salat wird typischerweise erst kurz vor dem Service mit Dressing angemacht?", options: ["Kartoffelsalat", "Linsensalat", "Blattsalat", "Fisolensalat"], correctAnswer: "Blattsalat", source: "Gerfried PDF, F14" },
            { question: "Was bedeutet 'Jus' in der Küche?", options: ["Eine Art dicke Suppe", "Ein spezielles Gewürz", "Bratensaft, Fleischsaft, Fruchtsaft", "Eine Mehlschwitze"], correctAnswer: "Bratensaft, Fleischsaft, Fruchtsaft", source: "Gerfried PDF, F15 / Lena PDF S.13" },
            { question: "Wann gilt Fleisch als Schlachtfleisch?", options: ["Wenn es von Wildtieren stammt", "Wenn die Tiere von Geburt an für den Verzehr bestimmt sind", "Wenn es älter als 2 Jahre ist", "Wenn es gepökelt wurde"], correctAnswer: "Wenn die Tiere von Geburt an für den Verzehr bestimmt sind", source: "Gerfried PDF, F16 / Lena PDF S.13" },
            { question: "Dürfen in Österreich Pferde für den menschlichen Verzehr geschlachtet werden?", options: ["Nein, niemals", "Ja, aber nur Fohlen", "Ja, wenn sie als Schlachtfleisch deklariert sind", "Nur mit Sondergenehmigung"], correctAnswer: "Ja, wenn sie als Schlachtfleisch deklariert sind", source: "Gerfried PDF, F17 & F18 / Lena PDF S.13" },
            { question: "Wie müssen Allergene gekennzeichnet werden?", options: ["Nur mündlich auf Nachfrage", "Gar nicht", "Schriftlich (Speisekarte, Aushang, elektronisch) oder mündlich durch geschulte Person mit schriftl. Hinweis", "Nur durch Symbole"], correctAnswer: "Schriftlich (Speisekarte, Aushang, elektronisch) oder mündlich durch geschulte Person mit schriftl. Hinweis", source: "Gerfried PDF, F19 / Lena PDF S.14" },
            { question: "Warum ist bei der Verarbeitung von Geflügel besondere Hygiene wichtig?", options: ["Wegen des hohen Fettgehalts", "Wegen der Gefahr von Salmonellen", "Weil es schnell austrocknet", "Weil es teuer ist"], correctAnswer: "Wegen der Gefahr von Salmonellen", source: "Gerfried PDF, F20 / Lena PDF S.14" },
            { question: "Welche Garmethode findet unter dem Siedepunkt statt?", options: ["Kochen", "Frittieren", "Grillen", "Pochieren"], correctAnswer: "Pochieren", source: "Gerfried PDF, F21" },
            { question: "Welche Garmethode bedeutet Garen im Fettbad?", options: ["Sautieren", "Backen", "Frittieren", "Dünsten"], correctAnswer: "Frittieren", source: "Gerfried PDF, F21" },
            { question: "Was bedeutet 'Sous-vide' Garen?", options: ["Grillen über Holzkohle", "Schnelles Anbraten in der Pfanne", "Vakuumgaren bei niedrigen Temperaturen", "Kochen im Dampfdrucktopf"], correctAnswer: "Vakuumgaren bei niedrigen Temperaturen", source: "Gerfried PDF, F21" },
            { question: "Welches Küchengerät wird zum Überbacken verwendet?", options: ["Kombidämpfer", "Cutter", "Salamander", "Steamer"], correctAnswer: "Salamander", source: "Gerfried PDF, F22 / Lena PDF S.8/S.10" },
            { question: "Was bedeutet 'Tranchieren'?", options: ["Suppe mit Butter binden", "Fleisch marinieren", "Gegartes Fleisch in Scheiben schneiden", "Speisen überbacken"], correctAnswer: "Gegartes Fleisch in Scheiben schneiden", source: "Gerfried PDF, F23 / Lena PDF S.9" },
            { question: "Was bedeutet 'Montieren' in Bezug auf Saucen oder Suppen?", options: ["Mit Mehl binden", "Mit Obers und Butter vollenden/schaumig schlagen", "Pürieren", "Klären"], correctAnswer: "Mit Obers und Butter vollenden/schaumig schlagen", source: "Gerfried PDF, F23" },
            { question: "Welche Teigart wird nicht roh, sondern abgebrannt verarbeitet?", options: ["Blätterteig", "Mürbteig", "Brandteig", "Germteig"], correctAnswer: "Brandteig", source: "Gerfried PDF, F24 / Lena PDF S.18" },
            { question: "Welche Suppenart wird durch pürierte Zutaten gebunden?", options: ["Einmachsuppe", "Cremesuppe", "Klare Suppe", "Püreesuppe"], correctAnswer: "Püreesuppe", source: "Gerfried PDF, F25 / Lena PDF S.6" },
            { question: "Was ist eine Consommé double?", options: ["Eine einfache Rindsuppe", "Eine doppelt geklärte Kraftsuppe", "Eine gebundene Gemüsesuppe", "Eine kalte Suppe"], correctAnswer: "Eine doppelt geklärte Kraftsuppe", source: "Gerfried PDF, F25" },
            { question: "Was ist bei der Menüplangestaltung wichtig?", options: ["Jeden Tag das Gleiche anbieten", "Nur teure Gerichte verwenden", "Abwechslung bei Zutaten und Zubereitungsart", "Nur schnelle Gerichte einplanen"], correctAnswer: "Abwechslung bei Zutaten und Zubereitungsart", source: "Gerfried PDF, F26 / Lena PDF S.11" },

            // Getränkekunde Block (Gerfried PDF / Lena PDF)
            { question: "Welche Weinkategorien gibt es in der Wachau DAC?", options: ["Classic, Reserve", "Kabinett, Spätlese, Auslese", "Steinfeder, Federspiel, Smaragd", "Ortswein, Lagenwein"], correctAnswer: "Steinfeder, Federspiel, Smaragd", source: "Gerfried PDF, F27 / Lena PDF S.14" },
            { question: "Welche Rebsorte ist typisch für das Weinviertel DAC?", options: ["Riesling", "Zweigelt", "Grüner Veltliner", "Sauvignon Blanc"], correctAnswer: "Grüner Veltliner", source: "Gerfried PDF, F27 / Lena PDF S.9" },
            { question: "Welche Rebsorte ist charakteristisch für den Schilcher aus der Weststeiermark DAC?", options: ["Sauvignon Blanc", "Blauer Wildbacher", "Welschriesling", "Morillon"], correctAnswer: "Blauer Wildbacher", source: "Gerfried PDF, F27 / Lena PDF S.5" },
            { question: "Welche Kaffeesorte wird eher für Espresso verwendet und wächst im Tiefland?", options: ["Arabica", "Liberica", "Robusta", "Maragogype"], correctAnswer: "Robusta", source: "Gerfried PDF, F28 / Lena PDF S.2-3/S.10" },
            { question: "Welche Teeart ist vollfermentiert?", options: ["Grüner Tee", "Weißer Tee", "Schwarzer Tee", "Oolong Tee"], correctAnswer: "Schwarzer Tee", source: "Gerfried PDF, F28 / Lena PDF S.2" },
            { question: "Was ist ein typischer Aperitif?", options: ["Whisky", "Süßer Likör", "Schaumwein", "Cognac"], correctAnswer: "Schaumwein", source: "Gerfried PDF, F29 / Lena PDF S.3" },
            { question: "Was ist ein typischer Digestif?", options: ["Gin Tonic", "Bier", "Destillate (z.B. Obstbrand)", "Weißwein"], correctAnswer: "Destillate (z.B. Obstbrand)", source: "Gerfried PDF, F29 / Lena PDF S.3" },
            { question: "Was passiert beim Maischen im Brauvorgang?", options: ["Hopfen wird hinzugefügt", "Hefe wird hinzugefügt", "Geschrotetes Malz wird mit Wasser angereichert", "Das Bier wird gekühlt"], correctAnswer: "Geschrotetes Malz wird mit Wasser angereichert", source: "Gerfried PDF, F30 / Lena PDF S.3" },
            { question: "Bei welcher Temperatur gärt obergäriges Bier typischerweise?", options: ["0-5°C", "5-9°C", "10-14°C", "15-20°C"], correctAnswer: "15-20°C", source: "Gerfried PDF, F30 / Lena PDF S.10" },
            { question: "Welches Bier ist ein Beispiel für ein untergäriges Bier?", options: ["Weizenbier", "Englisches Ale", "Märzen/Lager", "Deutsches Altbier"], correctAnswer: "Märzen/Lager", source: "Gerfried PDF, F30 / Lena PDF S.10" },
            { question: "Welche Biersorte wird typischerweise nicht filtriert?", options: ["Pils", "Märzen", "Zwickel", "Bockbier"], correctAnswer: "Zwickel", source: "Gerfried PDF, F30 / Lena PDF S.12" },

        ];


        // --- Quiz Logic ---
        // Get references to HTML elements
        const quizContainer = document.getElementById('quiz-container');
        const questionArea = document.getElementById('question-area');
        const resultsArea = document.getElementById('results-area');
        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const feedback = document.getElementById('feedback');
        const navigationButtonsContainer = document.getElementById('navigation-buttons');
        const submitButton = document.getElementById('submit-button');
        const nextQuestionButton = document.getElementById('next-question-button');
        const prevButton = document.getElementById('prev-button');
        const restartButton = document.getElementById('restart-button');
        const finalScoreCorrect = document.getElementById('final-score-correct');
        const finalScoreTotal = document.getElementById('final-score-total');
        const finalPercentage = document.getElementById('final-percentage');
        const finalGrade = document.getElementById('final-grade');
        const progressContainer = document.getElementById('progress-container');
        const progressBar = document.getElementById('progress-bar');
        const progressLabel = document.getElementById('progress-label');

        // Quiz state variables
        let currentQuestionIndex = 0;
        let score = 0;
        let questionHistory = []; // Stores answers and correctness for each question index
        let currentSelectedOption = null; // Track the currently selected option button element
        let canGoBack = true; // Flag to control the previous button behavior

        /**
         * Shuffles the elements of an array in place.
         * Uses the Fisher-Yates (aka Knuth) shuffle algorithm.
         * @param {Array} array The array to shuffle.
         */
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]]; // Swap elements
            }
        }

        /**
         * Initializes the question history array with null values.
         */
        function initializeHistory() {
             questionHistory = new Array(quizData.length).fill(null);
        }

        /**
         * Loads and displays the current question and its options.
         * Handles displaying previously answered questions in a read-only state.
         */
        function loadQuestion() {
            // --- Input Validation ---
             if (!quizData || quizData.length === 0) {
                 console.error("Quiz data is empty or not loaded.");
                 quizContainer.innerHTML = "<p class='text-red-600 font-bold text-center'>Fehler: Quizdaten konnten nicht geladen werden.</p>";
                 return;
             }
             if (currentQuestionIndex < 0 || currentQuestionIndex >= quizData.length) {
                 console.error(`Invalid question index: ${currentQuestionIndex}`);
                 if (currentQuestionIndex >= quizData.length) showResults();
                 return;
             }

            const currentQuestion = quizData[currentQuestionIndex];
             if (!currentQuestion || !currentQuestion.options || !currentQuestion.question) {
                 console.error(`Invalid question data at index: ${currentQuestionIndex}`, currentQuestion);
                 if (currentQuestionIndex < quizData.length - 1) {
                      loadNextQuestionLogic(); // Use the logic function
                 } else {
                      showResults();
                 }
                 return;
             }
            // --- End Input Validation ---

            const historyEntry = questionHistory[currentQuestionIndex];
            currentSelectedOption = null; // Reset selected option for the new question

            // Reset UI elements
            feedback.textContent = '';
            feedback.className = 'feedback-text mt-4';
            optionsContainer.innerHTML = '';

            // Display question text
            questionText.innerHTML = currentQuestion.question;

            // Update progress bar
            const progressPercent = ((currentQuestionIndex + 1) / quizData.length) * 100;
            progressBar.style.width = `${progressPercent}%`;
            progressLabel.textContent = `Frage ${currentQuestionIndex + 1} von ${quizData.length}`;

            // Shuffle options if it's a new question
            let displayOptions = [...currentQuestion.options];
            if (!historyEntry) {
                 shuffleArray(displayOptions);
            }

            // Create and display option buttons
            displayOptions.forEach(option => {
                const button = document.createElement('button');
                button.textContent = option;
                button.classList.add('option-button');
                optionsContainer.appendChild(button);

                if (historyEntry) {
                    // Question already answered (navigating back/forth)
                    button.disabled = true;
                    if (option === historyEntry.selectedAnswer) {
                        button.classList.add(historyEntry.isCorrect ? 'correct' : 'incorrect');
                    } else if (option === currentQuestion.correctAnswer && !historyEntry.isCorrect) {
                        button.classList.add('correct');
                    }
                } else {
                    // New question, add click listener
                    button.onclick = () => selectOption(button);
                }
            });

            // Show feedback if already answered
            if (historyEntry) {
                feedback.textContent = historyEntry.isCorrect ? 'Richtig!' : `Falsch. Die richtige Antwort war: ${currentQuestion.correctAnswer}`;
                feedback.classList.add(historyEntry.isCorrect ? 'correct' : 'incorrect');
            }

            // Update navigation/action button states
            updateNavigationButtons(!!historyEntry);

            // Show/hide relevant areas
            questionArea.classList.remove('hidden');
            resultsArea.classList.add('hidden');
            progressContainer.classList.remove('hidden');
            navigationButtonsContainer.classList.remove('hidden');
        }

       /**
        * Updates the visibility and state of navigation and action buttons.
        * @param {boolean} isAnswered - Whether the current question has already been answered.
        */
       function updateNavigationButtons(isAnswered) {
            // Previous Button Logic: Enable only if not on the first question AND canGoBack is true.
            // Use visibility to keep layout space.
            const isPrevButtonVisible = currentQuestionIndex > 0;
            prevButton.disabled = !isPrevButtonVisible || !canGoBack;
            prevButton.classList.toggle('invisible', !isPrevButtonVisible); // Use visibility hidden


            // Action Buttons Logic (Submit / Next)
            if (isAnswered) {
                // If question is already answered
                submitButton.classList.add('hidden'); // Hide submit
                nextQuestionButton.classList.remove('hidden'); // Show next
                nextQuestionButton.disabled = false;

                if (currentQuestionIndex === quizData.length - 1) {
                     nextQuestionButton.textContent = "Quiz beenden";
                } else {
                     nextQuestionButton.textContent = "Nächste Frage";
                }

            } else {
                // If question is new or not yet answered
                submitButton.classList.remove('hidden'); // Show submit
                submitButton.disabled = (currentSelectedOption === null);
                nextQuestionButton.classList.add('hidden'); // Hide next
                nextQuestionButton.disabled = true;
            }
        }


        /**
         * Handles the user selecting an answer option. Visually marks selection.
         * @param {HTMLButtonElement} button - The button element that was clicked.
         */
        function selectOption(button) {
            // Prevent action if already answered
            if (questionHistory[currentQuestionIndex]) return;

            // Remove selection from previously selected button (if any)
            const currentlySelected = optionsContainer.querySelector('.selected');
            if (currentlySelected) {
                currentlySelected.classList.remove('selected');
            }

            // Mark the new button as selected
            button.classList.add('selected');
            currentSelectedOption = button; // Store the selected button element

            // Enable the submit button
            submitButton.disabled = false;
        }

        /**
         * Checks the selected answer, provides feedback, updates score, stores history, and disables options.
         */
        function checkAnswer() {
             // Prevent checking if no option is selected or if already checked
            if (!currentSelectedOption || questionHistory[currentQuestionIndex]) return;

            const selectedOptionText = currentSelectedOption.textContent;
            const currentQuestion = quizData[currentQuestionIndex];
            const buttons = optionsContainer.querySelectorAll('.option-button');
            const isCorrect = (selectedOptionText === currentQuestion.correctAnswer);

            // Store result in history
            questionHistory[currentQuestionIndex] = {
                selectedAnswer: selectedOptionText,
                isCorrect: isCorrect,
                alreadyAnswered: true
            };

            // Update score and provide feedback
            if (isCorrect) {
                score++;
                feedback.textContent = 'Richtig!';
                feedback.classList.add('correct');
                currentSelectedOption.classList.add('correct');
            } else {
                feedback.textContent = `Falsch. Die richtige Antwort ist: ${currentQuestion.correctAnswer}`;
                feedback.classList.add('incorrect');
                currentSelectedOption.classList.add('incorrect');
                // Highlight the correct answer as well
                 buttons.forEach(btn => {
                    if (btn.textContent === currentQuestion.correctAnswer) {
                        btn.classList.add('correct');
                    }
                });
            }

            // Disable all option buttons and remove selection highlight
            buttons.forEach(btn => {
                 btn.disabled = true;
                 btn.classList.remove('selected');
            });

            // Allow going back again after answering
             canGoBack = true;

            // Update buttons: hide submit, show next
            updateNavigationButtons(true); // Update button states reflecting the answered state
        }


        /**
         * Logic to advance to the next question or show results.
         */
        function loadNextQuestionLogic() {
             if (currentQuestionIndex < quizData.length - 1) {
                 currentQuestionIndex++;
                 canGoBack = true; // Allow going back from the new question
                 loadQuestion();
             } else {
                 showResults();
             }
        }

        /**
         * Loads the previous question in the quiz sequence, if allowed.
         */
        function loadPreviousQuestion() {
             // Only allow going back if not on the first question AND the flag allows it
             if (currentQuestionIndex > 0 && canGoBack) {
                 currentQuestionIndex--;
                 canGoBack = false; // Prevent going back further immediately
                 loadQuestion();
             }
        }

        /**
        * Calculates the grade based on the percentage score.
        * @param {number} percentage - The percentage score achieved.
        * @returns {string} The corresponding grade.
        */
        function calculateGrade(percentage) {
            if (percentage >= 90) return "Sehr Gut";
            if (percentage >= 80) return "Gut";
            if (percentage >= 70) return "Befriedigend";
            if (percentage >= 50) return "Genügend";
            return "Nicht Genügend";
        }


        /**
         * Hides the question area and displays the final score and grade.
         */
        function showResults() {
            questionArea.classList.add('hidden');
            progressContainer.classList.add('hidden');
            navigationButtonsContainer.classList.add('hidden'); // Hide nav buttons on results page
            resultsArea.classList.remove('hidden'); // Show results area

            // Display the final score and percentage
            finalScoreCorrect.textContent = score;
            finalScoreTotal.textContent = quizData.length;
            const percentage = quizData.length > 0 ? Math.round((score / quizData.length) * 100) : 0;
            finalPercentage.textContent = percentage;

            // Calculate and display the grade
            const grade = calculateGrade(percentage);
            finalGrade.textContent = `Note: ${grade}`; // Display the calculated grade
        }

        /**
         * Resets the quiz state, shuffles questions, and loads the first question.
         */
        function restartQuiz() {
            currentQuestionIndex = 0;
            score = 0;
            currentSelectedOption = null;
            canGoBack = true; // Reset the flag on restart
            shuffleArray(quizData); // Re-shuffle questions for a new attempt
            initializeHistory(); // Reset the history
            resultsArea.classList.add('hidden'); // Hide results
            questionArea.classList.remove('hidden'); // Show question area
            navigationButtonsContainer.classList.remove('hidden'); // Show nav buttons
            loadQuestion(); // Load the first question
        }

        // --- Event Listeners ---
        submitButton.addEventListener('click', checkAnswer);
        nextQuestionButton.addEventListener('click', loadNextQuestionLogic); // Use the logic function
        prevButton.addEventListener('click', loadPreviousQuestion);
        restartButton.addEventListener('click', restartQuiz);

        // --- Initial Setup ---
        shuffleArray(quizData); // Shuffle questions on initial load
        initializeHistory(); // Prepare the history array
        loadQuestion(); // Load the first question

    </script>
